[project]
name = "irisai"
version = "1.0.0"
description = "IrisAI — AI-powered HPC research assistant with skill-based routing and MCP tools"
requires-python = ">=3.11"
dependencies = [
    "chainlit>=2.5.0",
    "litellm>=1.80.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.1.0",
    "openai>=1.0.0",
    "fastmcp>=3.2.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "aiofiles>=24.0.0",
]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests requiring LiteLLM proxy (deselect with '-m not e2e')",
    "mcp: tests requiring MCP server subprocess",
    "slow: tests that take >10 seconds",
]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "mcp_servers", "skills", "config"]
# Note: app.py is the Chainlit entrypoint, not a package module
